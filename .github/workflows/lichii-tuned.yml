name: lichii-tuned

# Windows builds of Lichii tuned for an Intel Arrow Lake (Core Ultra 200H) CPU and an
# AMD RDNA4 (RX 9070 XT) GPU. Every push to the `tuned` branch that touches the patch or this
# workflow builds every variant; the source is this branch plus lichii-tuned/lichii-tuned.patch.
on:
  push:
    branches: [tuned]
    paths:
      - "lichii-tuned/**"
      - ".github/workflows/lichii-tuned.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: windows ${{ matrix.variant }}
    runs-on: windows-2022
    timeout-minutes: 330
    # A newer push queues each variant behind the same variant of the running build instead of
    # cancelling it (so its compiler cache is saved for the next one), and not behind the others.
    concurrency:
      group: lichii-tuned-${{ github.ref }}-${{ matrix.variant }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # MinGW clang + the repo's PGO profile + x86-64-v3 (AVX2/BMI2/FMA) tuned for Arrow Lake.
          - variant: pgo
            lto: "OFF"
          # Same plus ThinLTO across the whole program.
          - variant: pgo-lto
            lto: "ON"
          # The same source built like the official MSVC download (MSVC, no PGO, baseline x86-64),
          # to tell compiler differences from source changes.
          - variant: msvc
            lto: "OFF"
            msvc: true
          # Instrumented build that records an Ocarina profile while you play (slower). Off until
          # a profile is wanted: the r7 pgo-train download records one for this code too.
          # - variant: pgo-train
          #   lto: "OFF"
          #   train: true
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
      # -ffp-contract=off: no fused multiply-adds the source does not ask for, so float results
      # match official (x86-64 baseline) builds.
      TUNE_FLAGS: -march=x86-64-v3 -mtune=arrowlake -ffp-contract=off
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Apply the tuning patch
        shell: bash
        run: |
          set -euo pipefail
          patch=lichii-tuned/lichii-tuned.patch
          if [ -s "$patch" ]; then
            git apply --whitespace=nowarn --stat "$patch"
            git apply --whitespace=nowarn "$patch"
          else
            echo "No patch: building the branch as is"
          fi
          # Name the build in the log and title bar: <commit>-tuned-r<run>-<variant>.
          printf '%s' "$GITHUB_SHA" > GIT-COMMIT
          printf '%s' "tuned-r${GITHUB_RUN_NUMBER}-${{ matrix.variant }}" > GIT-REFSPEC

      - name: Set up MSYS2
        if: ${{ !matrix.msvc }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p llvm:p compiler-rt:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p

      # MSVC toolchain, Qt, sccache and the Vulkan SDK exactly as the official MSVC build.
      - name: Set up MSVC
        if: matrix.msvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt for MSVC
        if: matrix.msvc
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        if: matrix.msvc
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install the Vulkan SDK
        if: matrix.msvc
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-tuned-${{ matrix.msvc && 'msvc-' || '' }}v1-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-tuned-${{ matrix.msvc && 'msvc-' || '' }}v1-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .ccache
            .sccache
            .thinlto
          key: objects-tuned-${{ matrix.variant }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-tuned-${{ matrix.variant }}-v1-

      - name: Configure
        if: ${{ !matrix.msvc }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          command -v llvm-ar llvm-ranlib clang ld.lld || true
          # Profiles recorded with a pgo-train build (lichii-tuned/pgo/*.profraw, or zips of them)
          # are merged with Lichii's own profile, weighted 4:1 toward the recorded game.
          profdata="$PWD/eglantine.profdata"
          shopt -s nullglob
          for zip in lichii-tuned/pgo/*.zip; do
            python -m zipfile -e "$zip" lichii-tuned/pgo/
          done
          raws=(lichii-tuned/pgo/*.profraw lichii-tuned/pgo/*/*.profraw)
          if [ "${{ matrix.train }}" != "true" ] && [ ${#raws[@]} -gt 0 ]; then
            inputs=(--weighted-input=1,eglantine.profdata)
            for raw in "${raws[@]}"; do inputs+=("--weighted-input=4,$raw"); done
            llvm-profdata merge -o merged.profdata "${inputs[@]}"
            profdata="$PWD/merged.profdata"
            echo "Merged ${#raws[@]} recorded profile(s) into merged.profdata"
          fi
          profile="-fprofile-use=$(cygpath -m "$profdata") -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          if [ "${{ matrix.train }}" = "true" ]; then
            profile="-fprofile-generate"
          fi
          linker="-fuse-ld=lld"
          extra=()
          if [ "${{ matrix.lto }}" = "ON" ]; then
            mkdir -p .thinlto
            linker="$linker -Wl,--thinlto-cache-dir=$(cygpath -m "$PWD/.thinlto")"
            # Static libraries of bitcode need an archiver that indexes it.
            for tool in AR:llvm-ar RANLIB:llvm-ranlib; do
              path=$(cygpath -m "$(command -v "${tool#*:}")")
              extra+=("-DCMAKE_${tool%%:*}=${path%.exe}.exe")
            done
          fi
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DENABLE_LTO=${{ matrix.lto }} \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            "-DCMAKE_EXE_LINKER_FLAGS=$linker" \
            "-DCMAKE_C_FLAGS=$profile $TUNE_FLAGS" \
            "-DCMAKE_CXX_FLAGS=$profile $TUNE_FLAGS" \
            "${extra[@]}"

      - name: Configure MSVC
        if: matrix.msvc
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=OFF
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        if: ${{ !matrix.msvc }}
        shell: msys2 {0}
        run: |
          ccache --zero-stats
          cmake --build build/release --target yuzu --parallel
          ccache --show-stats

      - name: Build MSVC
        if: matrix.msvc
        shell: bash
        run: |
          sccache --zero-stats
          cmake --build build/release --target yuzu --parallel
          sccache --show-stats

      - name: Stop sccache
        if: always() && matrix.msvc && steps.compiler-cache.outcome == 'success'
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            .ccache
            .sccache
            .thinlto
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      # Same packaging as upstream's MinGW build: Qt via windeployqt6, then every non-system DLL
      # the program and the Qt plugins pull in.
      - name: Package
        if: ${{ !matrix.msvc }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build/release/bin
          test -f lichii.exe
          windeployqt6 --no-translations --no-compiler-runtime --no-opengl-sw \
            --no-system-dxc-compiler --no-system-d3d-compiler lichii.exe
          deps() {
            objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
              [ -z "$dll" ] && continue
              source=$(command -v "$dll" 2>/dev/null || true)
              [ -z "$source" ] && continue
              case "$source" in
                *System32* | *SysWOW64*) continue ;;
              esac
              if [ ! -f "$dll" ]; then
                cp "$source" "$dll"
                deps "$source"
              fi
            done
          }
          deps lichii.exe
          find . -name '*.dll' | while read -r dll; do
            deps "$dll"
          done
          # README and A/B launchers (added by the patch).
          if [ -d "$GITHUB_WORKSPACE/dist/lichii-tuned" ]; then
            cp "$GITHUB_WORKSPACE"/dist/lichii-tuned/* .
          fi

      # Same packaging as upstream's MSVC build.
      - name: Package MSVC
        if: matrix.msvc
        shell: pwsh
        run: |
          if (-not (Test-Path build/release/bin/lichii.exe)) {
            throw "build/release/bin/lichii.exe was not produced"
          }
          windeployqt --release --no-translations build/release/bin/lichii.exe
          if (Test-Path dist/lichii-tuned) {
            Copy-Item dist/lichii-tuned/* build/release/bin/
          }

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: lichii-tuned-r${{ github.run_number }}-${{ matrix.variant }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### lichii-tuned r${GITHUB_RUN_NUMBER} (${{ matrix.variant }})"
            echo "- base: \`${GITHUB_SHA::10}\` on \`${GITHUB_REF_NAME}\`"
            if [ "${{ matrix.msvc }}" = "true" ]; then
              echo "- flags: MSVC, as the official windows-x86_64 build"
            else
              echo "- flags: ${{ matrix.train && 'PGO instrumentation' || 'PGO' }} + \`$TUNE_FLAGS\`, ThinLTO ${{ matrix.lto }}"
            fi
            if [ -s lichii-tuned/lichii-tuned.patch ]; then
              echo "- patch: $(grep -c '^diff --git' lichii-tuned/lichii-tuned.patch) files"
            fi
            if [ -f merged.profdata ]; then
              echo "- profile: eglantine.profdata merged with recorded profiles"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
