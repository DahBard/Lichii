name: lichii-tuned

# Windows and CachyOS (Linux) builds of Lichii tuned for an Intel Arrow Lake (Core Ultra 200H)
# CPU and an AMD RDNA4 (RX 9070 XT) GPU; the source is this branch plus
# lichii-tuned/lichii-tuned.patch. Every push to the `tuned` branch that touches the patch or this
# workflow builds the Windows variants. The CachyOS ones build only when the owner asks for a
# Linux build: run the workflow by hand with `only: cachyos` (or `all`).
on:
  push:
    branches: [tuned]
    paths:
      - "lichii-tuned/**"
      - ".github/workflows/lichii-tuned.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "Platforms to build"
        type: choice
        options: [windows, cachyos, all]
        default: windows

permissions:
  contents: read

jobs:
  build:
    name: windows ${{ matrix.variant }}
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'cachyos'
    runs-on: windows-2022
    timeout-minutes: 330
    # A newer push queues each variant behind the same variant of the running build instead of
    # cancelling it (so its compiler cache is saved for the next one), and not behind the others.
    concurrency:
      group: lichii-tuned-${{ github.ref }}-${{ matrix.variant }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # MinGW clang + the repo's PGO profile + x86-64-v3 (AVX2/BMI2/FMA) tuned for Arrow Lake.
          - variant: pgo
            lto: "OFF"
          # Same plus ThinLTO across the whole program.
          - variant: pgo-lto
            lto: "ON"
          # The same source built like the official MSVC download (MSVC, no PGO, baseline x86-64),
          # to tell compiler differences from source changes. Off until a glitch shows up only in
          # the pgo builds; run lichii-tuned/check_patch_warnings.py before turning it on.
          # - variant: msvc
          #   lto: "OFF"
          #   msvc: true
          # Instrumented build that records an Ocarina profile while you play (slower). On from
          # round 18, for the CPU work: profiles uploaded to lichii-tuned/pgo tune the next builds.
          - variant: pgo-train
            lto: "OFF"
            train: true
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
      # -ffp-contract=off: no fused multiply-adds the source does not ask for, so float results
      # match official (x86-64 baseline) builds.
      TUNE_FLAGS: -march=x86-64-v3 -mtune=arrowlake -ffp-contract=off
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Apply the tuning patch
        shell: bash
        run: |
          set -euo pipefail
          patch=lichii-tuned/lichii-tuned.patch
          if [ -s "$patch" ]; then
            git apply --whitespace=nowarn --stat "$patch"
            git apply --whitespace=nowarn "$patch"
          else
            echo "No patch: building the branch as is"
          fi
          # Name the build in the log and title bar: <commit>-tuned-r<run>-<variant>.
          printf '%s' "$GITHUB_SHA" > GIT-COMMIT
          printf '%s' "tuned-r${GITHUB_RUN_NUMBER}-${{ matrix.variant }}" > GIT-REFSPEC

      - name: Set up MSYS2
        if: ${{ !matrix.msvc }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p llvm:p compiler-rt:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p

      # MSVC toolchain, Qt, sccache and the Vulkan SDK exactly as the official MSVC build.
      - name: Set up MSVC
        if: matrix.msvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt for MSVC
        if: matrix.msvc
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        if: matrix.msvc
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install the Vulkan SDK
        if: matrix.msvc
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-tuned-${{ matrix.msvc && 'msvc-' || '' }}v1-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-tuned-${{ matrix.msvc && 'msvc-' || '' }}v1-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .ccache
            .sccache
            .thinlto
          key: objects-tuned-${{ matrix.variant }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-tuned-${{ matrix.variant }}-v1-

      - name: Configure
        if: ${{ !matrix.msvc }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          command -v llvm-ar llvm-ranlib clang ld.lld || true
          # Profiles recorded with a pgo-train build (lichii-tuned/pgo/*.profraw, or zips of them)
          # are merged with Lichii's own profile, weighted 4:1 toward the recorded game.
          profdata="$PWD/eglantine.profdata"
          shopt -s nullglob
          for zip in lichii-tuned/pgo/*.zip; do
            python -m zipfile -e "$zip" lichii-tuned/pgo/
          done
          raws=(lichii-tuned/pgo/*.profraw lichii-tuned/pgo/*/*.profraw)
          if [ "${{ matrix.train }}" != "true" ] && [ ${#raws[@]} -gt 0 ]; then
            inputs=(--weighted-input=1,eglantine.profdata)
            for raw in "${raws[@]}"; do inputs+=("--weighted-input=4,$raw"); done
            llvm-profdata merge -o merged.profdata "${inputs[@]}"
            profdata="$PWD/merged.profdata"
            echo "Merged ${#raws[@]} recorded profile(s) into merged.profdata"
          fi
          profile="-fprofile-use=$(cygpath -m "$profdata") -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          if [ "${{ matrix.train }}" = "true" ]; then
            profile="-fprofile-generate"
          fi
          linker="-fuse-ld=lld"
          extra=()
          if [ "${{ matrix.lto }}" = "ON" ]; then
            mkdir -p .thinlto
            linker="$linker -Wl,--thinlto-cache-dir=$(cygpath -m "$PWD/.thinlto")"
            # Static libraries of bitcode need an archiver that indexes it.
            for tool in AR:llvm-ar RANLIB:llvm-ranlib; do
              path=$(cygpath -m "$(command -v "${tool#*:}")")
              extra+=("-DCMAKE_${tool%%:*}=${path%.exe}.exe")
            done
          fi
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DENABLE_LTO=${{ matrix.lto }} \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            "-DCMAKE_EXE_LINKER_FLAGS=$linker" \
            "-DCMAKE_C_FLAGS=$profile $TUNE_FLAGS" \
            "-DCMAKE_CXX_FLAGS=$profile $TUNE_FLAGS" \
            "${extra[@]}"

      - name: Configure MSVC
        if: matrix.msvc
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=OFF
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        if: ${{ !matrix.msvc }}
        shell: msys2 {0}
        run: |
          ccache --zero-stats
          cmake --build build/release --target yuzu --parallel
          ccache --show-stats

      - name: Build MSVC
        if: matrix.msvc
        shell: bash
        run: |
          sccache --zero-stats
          cmake --build build/release --target yuzu --parallel
          sccache --show-stats

      - name: Stop sccache
        if: always() && matrix.msvc && steps.compiler-cache.outcome == 'success'
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            .ccache
            .sccache
            .thinlto
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      # Same packaging as upstream's MinGW build: Qt via windeployqt6, then every non-system DLL
      # the program and the Qt plugins pull in.
      - name: Package
        if: ${{ !matrix.msvc }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build/release/bin
          test -f lichii.exe
          windeployqt6 --no-translations --no-compiler-runtime --no-opengl-sw \
            --no-system-dxc-compiler --no-system-d3d-compiler lichii.exe
          deps() {
            objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
              [ -z "$dll" ] && continue
              source=$(command -v "$dll" 2>/dev/null || true)
              [ -z "$source" ] && continue
              case "$source" in
                *System32* | *SysWOW64*) continue ;;
              esac
              if [ ! -f "$dll" ]; then
                cp "$source" "$dll"
                deps "$source"
              fi
            done
          }
          deps lichii.exe
          find . -name '*.dll' | while read -r dll; do
            deps "$dll"
          done
          # README and A/B launchers (added by the patch).
          if [ -d "$GITHUB_WORKSPACE/dist/lichii-tuned" ]; then
            cp -r "$GITHUB_WORKSPACE"/dist/lichii-tuned/* .
          fi
          # Precompile recipes (Fritchii's shader preparation reads <exe dir>/recipes).
          mkdir -p recipes
          cp "$GITHUB_WORKSPACE"/lichii-tuned/recipes/*.nx2recipe recipes/

      # Same packaging as upstream's MSVC build.
      - name: Package MSVC
        if: matrix.msvc
        shell: pwsh
        run: |
          if (-not (Test-Path build/release/bin/lichii.exe)) {
            throw "build/release/bin/lichii.exe was not produced"
          }
          windeployqt --release --no-translations build/release/bin/lichii.exe
          if (Test-Path dist/lichii-tuned) {
            Copy-Item -Recurse dist/lichii-tuned/* build/release/bin/
          }
          New-Item -ItemType Directory -Force build/release/bin/recipes | Out-Null
          Copy-Item lichii-tuned/recipes/*.nx2recipe build/release/bin/recipes/

      # AMD FSR 4 for Ocarina: the AMD FSR SDK's signed Vulkan loader and upscaler, which may be
      # redistributed in binary form with the SDK's license. Pinned to SDK v2.4.0 by hash.
      - name: AMD FSR 4 libraries
        shell: bash
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/7539ae8b6568ad29ed78a753404351daf3b5cca7/Kits/FidelityFX
          cd build/release/bin
          fetch() {
            curl -fsSL --retry 4 --retry-delay 2 -o "$2" "$base/$1"
            echo "$3  $2" | sha256sum -c -
          }
          fetch signedbin/amd_fidelityfx_loader_vk.dll amd_fidelityfx_loader_vk.dll \
            38a56a01fb3565c0757d9f5c1e4e69de4b65e5f2e5769b323b200dc1f142bab9
          fetch signedbin/amd_fidelityfx_upscaler_vk.dll amd_fidelityfx_upscaler_vk.dll \
            4a7e895af6e0b615d40a84d59eb8c2b1054ad91cdd0c739567940270d51bdab7
          fetch docs/license.md amd_fidelityfx_license.md \
            32357259b965d6a8001e9e508ba60eda6034027c5923a7d226ffbaff813c2bfb

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: lichii-tuned-r${{ github.run_number }}-${{ matrix.variant }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### lichii-tuned r${GITHUB_RUN_NUMBER} (${{ matrix.variant }})"
            echo "- base: \`${GITHUB_SHA::10}\` on \`${GITHUB_REF_NAME}\`"
            if [ "${{ matrix.msvc }}" = "true" ]; then
              echo "- flags: MSVC, as the official windows-x86_64 build"
            else
              echo "- flags: ${{ matrix.train && 'PGO instrumentation' || 'PGO' }} + \`$TUNE_FLAGS\`, ThinLTO ${{ matrix.lto }}"
            fi
            if [ -s lichii-tuned/lichii-tuned.patch ]; then
              echo "- patch: $(grep -c '^diff --git' lichii-tuned/lichii-tuned.patch) files"
            fi
            if [ -f merged.profdata ]; then
              echo "- profile: eglantine.profdata merged with recorded profiles"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The same source built in CachyOS's x86-64-v3 container against its own Qt 6, FFmpeg, SDL3 and
  # system libraries, by clang with Lichii's PGO profile, for x86-64-v3 with generic tuning: any
  # Intel Core from Haswell (4th gen) on and every Intel CPU from 12th gen on, Pentium, Celeron
  # and N100-class included (and AMD Zen). The v3 container's static libraries (Boost) are
  # x86-64-v3 too; the v4 one would need AVX-512, which Intel's consumer CPUs since 12th gen lack.
  # Packaged as a tar with .sh twins of the Windows launchers (lichii-tuned/README-cachyos.md).
  cachyos:
    name: cachyos ${{ matrix.variant }}
    if: github.event_name == 'workflow_dispatch' && inputs.only != 'windows'
    runs-on: ubuntu-24.04
    container:
      image: cachyos/cachyos-v3:latest
      # The runner's own SDKs, emptied in the first step: the build needs their disk space.
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
        - /usr/local/share/boost:/host/boost
    timeout-minutes: 330
    # As for Windows: a newer push queues behind the running build of the same variant.
    concurrency:
      group: lichii-tuned-cachyos-${{ github.ref }}-${{ matrix.variant }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: pgo
            lto: "OFF"
          - variant: pgo-lto
            lto: "ON"
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Less than Windows: the repository has 10 GB of caches for every variant together.
      CCACHE_MAXSIZE: 1500M
      CCACHE_COMPILERCHECK: content
      # The repo's "v3" preset (x86-64-v3, generic tuning) rather than the Windows builds' Arrow
      # Lake tuning, for any modern Intel CPU. -ffp-contract=off: no fused multiply-adds the source
      # does not ask for, so float results match official (x86-64 baseline) builds.
      TUNE_FLAGS: -march=x86-64-v3 -mtune=generic -ffp-contract=off
      # eglantine.profdata is LLVM's indexed profile format 14, which only LLVM 23 and newer
      # read. CachyOS's own clang builds when its llvm-profdata reads the profile; otherwise this
      # LLVM release does, pinned by hash.
      LLVM_RELEASE: 23.1.5
      LLVM_SHA256: f72edb0b36580ece7f52e23858f00c18fad4e87395ea7ad05d7e55c39f8fc78a
    steps:
      - name: Free disk space
        run: |
          df -h / "$GITHUB_WORKSPACE" | sed 's/^/before: /'
          rm -rf /host/dotnet/* /host/android/* /host/ghc/* /host/boost/* || true
          df -h / "$GITHUB_WORKSPACE" | sed 's/^/after: /'

      # The keyrings first, so packages signed by newer keys install on an older image. No
      # `zlib`: CachyOS's zlib is zlib-ng-compat, which pacman would have to remove for it.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          if [ ! -f /etc/pacman.d/gnupg/trustdb.gpg ]; then
            pacman-key --init
            pacman-key --populate
          fi
          pacman -Sy --noconfirm --needed archlinux-keyring cachyos-keyring
          pacman -Su --noconfirm --needed \
            base-devel git cmake ninja ccache python clang lld llvm \
            boost catch2 enet ffmpeg fmt glslang libzip lz4 nlohmann-json openssl opus \
            qt6-base qt6-charts qt6-svg qt6-wayland sdl3 zstd zip unzip \
            vulkan-headers vulkan-icd-loader vulkan-utility-libraries libusb \
            spirv-tools spirv-headers libpulse alsa-lib
          pacman -Q clang qt6-base ffmpeg sdl3 boost mesa 2>/dev/null || true

      - name: Check out source
        uses: actions/checkout@v5

      - name: Apply the tuning patch
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          patch=lichii-tuned/lichii-tuned.patch
          if [ -s "$patch" ]; then
            git apply --whitespace=nowarn --stat "$patch"
            git apply --whitespace=nowarn "$patch"
          else
            echo "No patch: building the branch as is"
          fi
          # Name the build in the log and title bar: <commit>-tuned-r<run>-cachyos-<variant>.
          printf '%s' "$GITHUB_SHA" > GIT-COMMIT
          printf '%s' "tuned-r${GITHUB_RUN_NUMBER}-cachyos-${{ matrix.variant }}" > GIT-REFSPEC

      - name: Restore LLVM
        id: llvm-cache
        uses: actions/cache/restore@v5
        with:
          path: .llvm
          key: llvm-${{ env.LLVM_RELEASE }}-linux-x64-v1

      - name: Toolchain
        id: toolchain
        run: |
          set -euo pipefail
          if llvm-profdata show eglantine.profdata > /dev/null 2>&1; then
            echo "Using CachyOS's $(clang --version | head -1)"
            echo "bin=/usr/bin" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "CachyOS's $(clang --version | head -1) can't read eglantine.profdata: LLVM $LLVM_RELEASE"
          llvm="$GITHUB_WORKSPACE/.llvm"
          if [ ! -x "$llvm/bin/clang" ]; then
            rm -rf "$llvm"
            mkdir -p "$llvm"
            top="LLVM-$LLVM_RELEASE-Linux-X64"
            curl -fsSL --retry 4 --retry-delay 2 -o llvm.tar.xz \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_RELEASE/$top.tar.xz"
            echo "$LLVM_SHA256  llvm.tar.xz" | sha256sum -c -
            # Only the compiler, linker, archiver and profile tools, and clang's own headers.
            tar -xJf llvm.tar.xz -C "$llvm" --strip-components=1 \
              "$top/bin/clang" "$top/bin/clang++" "$top/bin/clang-23" "$top/bin/ld.lld" \
              "$top/bin/lld" "$top/bin/llvm-ar" "$top/bin/llvm-ranlib" "$top/bin/llvm-nm" \
              "$top/bin/llvm-profdata" "$top/bin/llvm-strip" "$top/lib/clang"
            rm llvm.tar.xz
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
          "$llvm/bin/clang" --version | head -1
          "$llvm/bin/llvm-profdata" show eglantine.profdata > /dev/null
          echo "bin=$llvm/bin" >> "$GITHUB_OUTPUT"

      - name: Save LLVM
        if: steps.toolchain.outputs.save == 'true'
        uses: actions/cache/save@v5
        with:
          path: .llvm
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-tuned-cachyos-v1-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-tuned-cachyos-v1-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .ccache
            .thinlto
          key: objects-tuned-cachyos-${{ matrix.variant }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-tuned-cachyos-${{ matrix.variant }}-v1-

      # Boost links statically and fmt is built from source: CachyOS moves both to new sonames
      # often, which would stop an older build from starting.
      - name: Configure
        run: |
          set -euo pipefail
          bin="${{ steps.toolchain.outputs.bin }}"
          # Profiles recorded with a pgo-train build (lichii-tuned/pgo/*.profraw, or zips of them)
          # are merged with Lichii's own profile, weighted 4:1 toward the recorded game.
          profdata="$PWD/eglantine.profdata"
          shopt -s nullglob
          for zip in lichii-tuned/pgo/*.zip; do
            python -m zipfile -e "$zip" lichii-tuned/pgo/
          done
          raws=(lichii-tuned/pgo/*.profraw lichii-tuned/pgo/*/*.profraw)
          if [ ${#raws[@]} -gt 0 ]; then
            inputs=(--weighted-input=1,eglantine.profdata)
            for raw in "${raws[@]}"; do inputs+=("--weighted-input=4,$raw"); done
            "$bin/llvm-profdata" merge -o merged.profdata "${inputs[@]}"
            profdata="$PWD/merged.profdata"
            echo "Merged ${#raws[@]} recorded profile(s) into merged.profdata"
          fi
          profile="-fprofile-use=$profdata -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          linker="-fuse-ld=lld"
          if [ "${{ matrix.lto }}" = "ON" ]; then
            mkdir -p .thinlto
            linker="$linker -Wl,--thinlto-cache-dir=$PWD/.thinlto"
          fi
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=OFF \
            -DYUZU_USE_BUNDLED_FFMPEG=OFF \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DBoost_USE_STATIC_LIBS=ON \
            -Dfmt_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DENABLE_LTO=${{ matrix.lto }} \
            "-DCMAKE_C_COMPILER=$bin/clang" \
            "-DCMAKE_CXX_COMPILER=$bin/clang++" \
            "-DCMAKE_AR=$bin/llvm-ar" \
            "-DCMAKE_RANLIB=$bin/llvm-ranlib" \
            "-DCMAKE_EXE_LINKER_FLAGS=$linker" \
            "-DCMAKE_C_FLAGS=$profile $TUNE_FLAGS" \
            "-DCMAKE_CXX_FLAGS=$profile $TUNE_FLAGS"

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        run: |
          set -euo pipefail
          ccache --zero-stats
          cmake --build build/release --target yuzu --parallel
          ccache --show-stats

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            .ccache
            .thinlto
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      # A tar keeps the executable bits that GitHub's artifact zip drops. cachyos-packages.txt
      # lists the CachyOS packages that own the libraries the program links directly (pacman
      # brings their own dependencies), plus the Qt plugins it uses (Wayland, SVG icons), for
      # `pacman -S --needed $(cat cachyos-packages.txt)`.
      - name: Package
        run: |
          set -euo pipefail
          name="lichii-tuned-r${GITHUB_RUN_NUMBER}-cachyos-${{ matrix.variant }}"
          out="dist-cachyos/$name"
          mkdir -p "$out"
          test -x build/release/bin/lichii
          cp build/release/bin/lichii "$out/"
          "${{ steps.toolchain.outputs.bin }}/llvm-strip" "$out/lichii"
          if [ -f build/release/bin/nx2_switches.txt ]; then
            cp build/release/bin/nx2_switches.txt "$out/"
          else
            cp dist/nx2_switches.txt "$out/"
          fi
          grep -q '^EDEN_NX2_PRELOAD_ALL_PIPELINES=1' "$out/nx2_switches.txt"
          if [ -d dist/lichii-tuned ]; then
            cp dist/lichii-tuned/*.txt "$out/"
            python -I lichii-tuned/make_linux_launchers.py dist/lichii-tuned "$out"
          fi
          mkdir -p "$out/recipes"
          cp lichii-tuned/recipes/*.nx2recipe "$out/recipes/"
          cp lichii-tuned/README-cachyos.md "$out/"
          needed=" $(readelf -d "$out/lichii" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | tr '\n' ' ') "
          {
            ldd "$out/lichii" | while read -r lib _ path _; do
              case "$needed" in *" $lib "*) ;; *) continue ;; esac
              if [ -e "$path" ]; then
                pacman -Qqo "$path" 2>/dev/null || true
              fi
            done
            echo qt6-wayland
            echo qt6-svg
          } | grep -v -x -E 'glibc|gcc-libs|libgcc|libstdc\+\+' | sort -u > "$out/cachyos-packages.txt"
          echo "Packages:"; cat "$out/cachyos-packages.txt"
          if ldd "$out/lichii" | grep -q 'not found'; then
            ldd "$out/lichii" | grep 'not found'
            exit 1
          fi
          tar -czf "dist-cachyos/$name.tar.gz" -C dist-cachyos "$name"
          ls -la dist-cachyos
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: dist-cachyos/${{ env.NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "### lichii-tuned r${GITHUB_RUN_NUMBER} (cachyos ${{ matrix.variant }})"
            echo "- base: \`${GITHUB_SHA::10}\` on \`${GITHUB_REF_NAME}\`"
            echo "- compiler: $("${{ steps.toolchain.outputs.bin }}/clang" --version 2>/dev/null | head -1)"
            echo "- flags: PGO + \`$TUNE_FLAGS\`, ThinLTO ${{ matrix.lto }}"
            if [ -s lichii-tuned/lichii-tuned.patch ]; then
              echo "- patch: $(grep -c '^diff --git' lichii-tuned/lichii-tuned.patch) files"
            fi
            if [ -f merged.profdata ]; then
              echo "- profile: eglantine.profdata merged with recorded profiles"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
