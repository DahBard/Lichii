name: lichii-tuned

# Windows builds of Lichii tuned for an Intel Arrow Lake (Core Ultra 200H) CPU and an AMD RDNA4
# (RX 9070 XT) GPU; the source is this branch (upstream's tree, build 171 since 2026-11-13) plus
# lichii-tuned/lichii-tuned.patch (branch tuned4). Every push to the `tuned` branch that touches the
# patch or this workflow builds pgo-lto; a manual run builds the variant it names (pgo-train records
# a PGO profile). The CachyOS (Linux) job was removed on 2026-11-11: the owner builds for Windows only.
on:
  push:
    branches: [tuned]
    paths:
      - "lichii-tuned/**"
      - ".github/workflows/lichii-tuned.yml"
  workflow_dispatch:
    inputs:
      variant:
        description: Variant to build
        type: choice
        options: [pgo-lto, pgo, pgo-train]
        default: pgo-lto

env:
  # Builds are numbered r<run + BUILD_OFFSET>: this repository's run #1 is r61, after r60, the
  # last build before the move to this repository.
  BUILD_OFFSET: 60

permissions:
  contents: read

jobs:
  build:
    name: windows ${{ matrix.variant }}
    runs-on: windows-2022
    timeout-minutes: 330
    # A newer push queues each variant behind the same variant of the running build instead of
    # cancelling it (so its compiler cache is saved for the next one), and not behind the others.
    concurrency:
      group: lichii-tuned-${{ github.ref }}-${{ matrix.variant }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # pgo-lto: MinGW clang + the repo's PGO profile + ThinLTO + x86-64-v3 (AVX2/BMI2/FMA) tuned
        # for Arrow Lake. pgo: the same without LTO. pgo-train: instrumented, records an Ocarina
        # profile while you play (slower); profiles uploaded to lichii-tuned/pgo tune the next
        # builds. Pushes build pgo-lto only: Actions minutes and artifact storage are limited here.
        # (An MSVC variant, msvc: true, tells compiler differences from source changes; run
        # lichii-tuned/check_patch_warnings.py before adding it.)
        include: ${{ fromJSON(format('[{0}]', (github.event_name == 'workflow_dispatch' && inputs.variant == 'pgo') && '{"variant":"pgo","lto":"OFF"}' || (github.event_name == 'workflow_dispatch' && inputs.variant == 'pgo-train') && '{"variant":"pgo-train","lto":"OFF","train":true}' || '{"variant":"pgo-lto","lto":"ON"}')) }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
      # -ffp-contract=off: no fused multiply-adds the source does not ask for, so float results
      # match official (x86-64 baseline) builds.
      TUNE_FLAGS: -march=x86-64-v3 -mtune=arrowlake -ffp-contract=off
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Apply the tuning patch
        shell: bash
        run: |
          set -euo pipefail
          patch=lichii-tuned/lichii-tuned.patch
          if [ -s "$patch" ]; then
            git apply --whitespace=nowarn --stat "$patch"
            git apply --whitespace=nowarn "$patch"
          else
            echo "No patch: building the branch as is"
          fi
          echo "BUILD_R=$((GITHUB_RUN_NUMBER + BUILD_OFFSET))" >> "$GITHUB_ENV"
          BUILD_R=$((GITHUB_RUN_NUMBER + BUILD_OFFSET))
          # Name the build in the log and title bar: <commit>-tuned-r<build>-<variant>.
          printf '%s' "$GITHUB_SHA" > GIT-COMMIT
          printf '%s' "tuned-r${BUILD_R}-${{ matrix.variant }}" > GIT-REFSPEC

      - name: Set up MSYS2
        if: ${{ !matrix.msvc }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p llvm:p compiler-rt:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p

      # MSVC toolchain, Qt, sccache and the Vulkan SDK exactly as the official MSVC build.
      - name: Set up MSVC
        if: matrix.msvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt for MSVC
        if: matrix.msvc
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        if: matrix.msvc
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install the Vulkan SDK
        if: matrix.msvc
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-tuned-${{ matrix.msvc && 'msvc-' || '' }}v1-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-tuned-${{ matrix.msvc && 'msvc-' || '' }}v1-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .ccache
            .sccache
            .thinlto
          key: objects-tuned-${{ matrix.variant }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-tuned-${{ matrix.variant }}-v1-

      # Profiles the owner recorded with a pgo-train build, attached to pgo-* releases (round 22).
      - name: Fetch recorded PGO profiles
        if: ${{ !matrix.msvc && !matrix.train }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python lichii-tuned/fetch_pgo_profiles.py lichii-tuned/pgo

      # Symbols for crash reports (the log's "Host crash:" lines name lichii.exe+offset): MinGW links with
      # the COFF symbol table, the symbols artifact keeps that exe, and Package strips the one
      # that ships. Only the checkout changes, not lichii-tuned.patch. Linked unstripped, lld also
      # writes a .buildid section and a CodeView debug entry, which the stripped exe keeps.
      - name: Keep the symbol table
        if: ${{ !matrix.msvc }}
        shell: bash
        run: |
          set -euo pipefail
          file=externals/cmake-modules/DetectPlatform.cmake
          sed -i 's/-Wl,--strip-all //' "$file"
          if grep -q -e '--strip-all' "$file"; then
            echo "::error::$file still strips lichii.exe"
            exit 1
          fi

      - name: Configure
        if: ${{ !matrix.msvc }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          command -v llvm-ar llvm-ranlib clang ld.lld || true
          # Profiles recorded with a pgo-train build (lichii-tuned/pgo/*.profraw, or zips of them)
          # are merged with Lichii's own profile. A last dump is weighted 70:1 and a whole file 4:1:
          # either way pgo-r49 is 97% of the merged counts, as in r50-r54.
          profdata="$PWD/eglantine.profdata"
          shopt -s nullglob
          for zip in lichii-tuned/pgo/*.zip; do
            python -m zipfile -e "$zip" lichii-tuned/pgo/ ||
              echo "::warning::could not extract all of $zip"
          done
          raws=(lichii-tuned/pgo/*.profraw lichii-tuned/pgo/*/*.profraw)
          if [ "${{ matrix.train }}" != "true" ] && [ ${#raws[@]} -gt 0 ]; then
            # A pgo-train build appends a dump of all its counts so far every 30 s: merge only
            # the last dump of each session that llvm-profdata reads, cut into build/pgo-last
            # (out of the raws glob). MSYS2's Python is a native program: it gets a Windows path.
            mkdir -p build/pgo-last
            profdata_tool=$(cygpath -m "$(command -v llvm-profdata)") || profdata_tool=llvm-profdata
            inputs=(--weighted-input=1,eglantine.profdata)
            n=0 cuts=0 wholes=0
            for raw in "${raws[@]}"; do
              n=$((n + 1))
              last="build/pgo-last/$n-${raw##*/}"
              if python -I lichii-tuned/profraw_last_dump.py --llvm-profdata "$profdata_tool" \
                "$raw" "$last"; then
                echo "PGO profile $raw: merging the last readable dump of each session ($last)"
                inputs+=("--weighted-input=70,$last")
                cuts=$((cuts + 1))
              elif llvm-profdata show "$raw" > /dev/null 2>&1; then
                echo "::warning::PGO profile $raw: profraw_last_dump.py failed; merging the whole file"
                inputs+=("--weighted-input=4,$raw")
                wholes=$((wholes + 1))
              else
                echo "::warning::PGO profile $raw: llvm-profdata does not read it; not merged"
              fi
            done
            if [ $((cuts + wholes)) -eq 0 ]; then
              echo "::warning::llvm-profdata reads none of the recorded profiles; using Lichii's own"
            elif llvm-profdata merge --failure-mode=all -o merged.profdata "${inputs[@]}"; then
              profdata="$PWD/merged.profdata"
              echo "Merged $((cuts + wholes)) recorded profile(s) into merged.profdata ($cuts cut, $wholes whole)"
            else
              echo "::warning::llvm-profdata could not read the recorded profiles; using Lichii's own"
            fi
          fi
          profile="-fprofile-use=$(cygpath -m "$profdata") -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          if [ "${{ matrix.train }}" = "true" ]; then
            profile="-fprofile-generate"
          fi
          linker="-fuse-ld=lld"
          extra=()
          if [ "${{ matrix.lto }}" = "ON" ]; then
            mkdir -p .thinlto
            linker="$linker -Wl,--thinlto-cache-dir=$(cygpath -m "$PWD/.thinlto")"
            # Static libraries of bitcode need an archiver that indexes it.
            for tool in AR:llvm-ar RANLIB:llvm-ranlib; do
              path=$(cygpath -m "$(command -v "${tool#*:}")")
              extra+=("-DCMAKE_${tool%%:*}=${path%.exe}.exe")
            done
          fi
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DLICHII_TESTS=OFF \
            -DLICHII_CMD=OFF \
            -DLICHII_ROOM=OFF \
            -DLICHII_ROOM_STANDALONE=OFF \
            -DLICHII_USE_BUNDLED_QT=OFF \
            -DLICHII_USE_BUNDLED_SDL3=ON \
            -DLICHII_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DENABLE_LTO=${{ matrix.lto }} \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            "-DCMAKE_EXE_LINKER_FLAGS=$linker" \
            "-DCMAKE_C_FLAGS=$profile $TUNE_FLAGS" \
            "-DCMAKE_CXX_FLAGS=$profile $TUNE_FLAGS" \
            "${extra[@]}"

      - name: Configure MSVC
        if: matrix.msvc
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DLICHII_TESTS=OFF
          -DLICHII_CMD=OFF
          -DLICHII_ROOM=OFF
          -DLICHII_ROOM_STANDALONE=OFF
          -DLICHII_USE_BUNDLED_QT=OFF
          -DLICHII_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        if: ${{ !matrix.msvc }}
        shell: msys2 {0}
        run: |
          ccache --zero-stats
          # -k 0: a failing file doesn't stop the others, so one run lists every error.
          cmake --build build/release --target lichii --parallel -- -k 0
          ccache --show-stats

      - name: Build MSVC
        if: matrix.msvc
        shell: bash
        run: |
          sccache --zero-stats
          cmake --build build/release --target lichii --parallel -- -k 0
          sccache --show-stats

      - name: Stop sccache
        if: always() && matrix.msvc && steps.compiler-cache.outcome == 'success'
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            .ccache
            .sccache
            .thinlto
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      # Same packaging as upstream's MinGW build: Qt via windeployqt6, then every non-system DLL
      # the program and the Qt plugins pull in.
      - name: Package
        if: ${{ !matrix.msvc }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build/release/bin
          test -f lichii.exe
          # The symbols artifact gets lichii.exe as linked; the package ships it stripped.
          symbols="$(cygpath -u "$GITHUB_WORKSPACE")/build/symbols"
          mkdir -p "$symbols"
          cp lichii.exe "$symbols/lichii.exe"
          llvm-objcopy --strip-all lichii.exe
          if [ -f "$GITHUB_WORKSPACE/lichii-tuned/symbolize_crash.py" ]; then
            cp "$GITHUB_WORKSPACE/lichii-tuned/symbolize_crash.py" "$symbols/"
          fi
          {
            echo "lichii-tuned r${BUILD_R} ${{ matrix.variant }}, commit ${GITHUB_SHA}"
            echo "Symbols for the \"Host crash:\" lines of eden_log.txt from the lichii-tuned-r${BUILD_R}-${{ matrix.variant }} package:"
            echo "  python3 -I symbolize_crash.py eden_log.txt lichii.exe"
            sha256sum "$symbols/lichii.exe" | sed "s|  .*|  lichii.exe (this one, with symbols)|"
            sha256sum lichii.exe | sed "s|  .*|  lichii.exe (shipped, stripped)|"
          } > "$symbols/lichii-symbols.txt"
          windeployqt6 --no-translations --no-compiler-runtime --no-opengl-sw \
            --no-system-dxc-compiler --no-system-d3d-compiler lichii.exe
          deps() {
            objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
              [ -z "$dll" ] && continue
              source=$(command -v "$dll" 2>/dev/null || true)
              [ -z "$source" ] && continue
              case "$source" in
                *System32* | *SysWOW64*) continue ;;
              esac
              if [ ! -f "$dll" ]; then
                cp "$source" "$dll"
                deps "$source"
              fi
            done
          }
          deps lichii.exe
          find . -name '*.dll' | while read -r dll; do
            deps "$dll"
          done
          # README and A/B launchers (added by the patch).
          if [ -d "$GITHUB_WORKSPACE/dist/lichii-tuned" ]; then
            cp -r "$GITHUB_WORKSPACE"/dist/lichii-tuned/* .
          fi
          # Precompile recipes (Fritchii's shader preparation reads <exe dir>/recipes).
          mkdir -p recipes
          cp "$GITHUB_WORKSPACE"/lichii-tuned/recipes/*.nx2recipe recipes/

      # Same packaging as upstream's MSVC build.
      - name: Package MSVC
        if: matrix.msvc
        shell: pwsh
        run: |
          if (-not (Test-Path build/release/bin/lichii.exe)) {
            throw "build/release/bin/lichii.exe was not produced"
          }
          windeployqt --release --no-translations build/release/bin/lichii.exe
          if (Test-Path dist/lichii-tuned) {
            Copy-Item -Recurse dist/lichii-tuned/* build/release/bin/
          }
          New-Item -ItemType Directory -Force build/release/bin/recipes | Out-Null
          Copy-Item lichii-tuned/recipes/*.nx2recipe build/release/bin/recipes/

      # AMD FSR 4 and AMD frame generation (CheezyEmu's, round 22): AMD FidelityFX SDK v2.4.0's
      # signed Vulkan loader, upscaler and frame generation DLLs, loaded from next to lichii.exe.
      # AMD's license allows redistributing them in binary form with it. Pinned by hash (the same
      # files CheezyEmu commits in externals/FidelityFX-SDK-2.4/bin).
      - name: AMD FidelityFX libraries
        shell: bash
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/7539ae8b6568ad29ed78a753404351daf3b5cca7/Kits/FidelityFX
          cd build/release/bin
          fetch() {
            curl -fsSL --retry 4 --retry-delay 2 -o "$2" "$base/$1"
            echo "$3  $2" | sha256sum -c -
          }
          fetch signedbin/amd_fidelityfx_loader_vk.dll amd_fidelityfx_loader_vk.dll \
            38a56a01fb3565c0757d9f5c1e4e69de4b65e5f2e5769b323b200dc1f142bab9
          fetch signedbin/amd_fidelityfx_upscaler_vk.dll amd_fidelityfx_upscaler_vk.dll \
            4a7e895af6e0b615d40a84d59eb8c2b1054ad91cdd0c739567940270d51bdab7
          fetch signedbin/amd_fidelityfx_framegeneration_vk.dll amd_fidelityfx_framegeneration_vk.dll \
            d002dabff8c5e71eaa715fc99438cd4dc81230262a7897b16bc402efec3498b4
          fetch docs/license.md amd_fidelityfx_license.md \
            32357259b965d6a8001e9e508ba60eda6034027c5923a7d226ffbaff813c2bfb

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: lichii-tuned-r${{ env.BUILD_R }}-${{ matrix.variant }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 3

      - name: Upload symbols
        if: ${{ !matrix.msvc }}
        uses: actions/upload-artifact@v7
        with:
          name: lichii-tuned-r${{ env.BUILD_R }}-${{ matrix.variant }}-symbols
          path: build/symbols/
          if-no-files-found: error
          retention-days: 3

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### lichii-tuned r${BUILD_R} (${{ matrix.variant }})"
            echo "- base: \`${GITHUB_SHA::10}\` on \`${GITHUB_REF_NAME}\`"
            if [ "${{ matrix.msvc }}" = "true" ]; then
              echo "- flags: MSVC, as the official windows-x86_64 build"
            else
              echo "- flags: ${{ matrix.train && 'PGO instrumentation' || 'PGO' }} + \`$TUNE_FLAGS\`, ThinLTO ${{ matrix.lto }}"
            fi
            if [ -s lichii-tuned/lichii-tuned.patch ]; then
              echo "- patch: $(grep -c '^diff --git' lichii-tuned/lichii-tuned.patch) files"
            fi
            if [ -f build/symbols/lichii.exe ]; then
              echo "- symbols: \`lichii-tuned-r${BUILD_R}-${{ matrix.variant }}-symbols\` (lichii.exe before stripping)"
            fi
            if [ -f merged.profdata ]; then
              echo "- profile: eglantine.profdata merged with recorded profiles"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
