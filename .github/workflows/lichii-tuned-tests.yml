name: lichii-tuned-tests

# Upstream Lichii's unit tests (the `tests` program, src/tests) on the tuned source: this branch
# plus lichii-tuned/lichii-tuned.patch, built with the MinGW clang of lichii-tuned.yml's Windows
# builds (without PGO) and run on the runner. It uploads no build. It is its own workflow so that
# lichii-tuned.yml's run numbers, which name the builds, don't change.
on:
  push:
    branches: [tuned]
    paths:
      - "lichii-tuned/lichii-tuned.patch"
      - ".github/workflows/lichii-tuned-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: windows unit tests
    runs-on: windows-2022
    timeout-minutes: 240
    concurrency:
      group: lichii-tuned-tests-${{ github.ref }}
      cancel-in-progress: false
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
      TUNE_FLAGS: -march=x86-64-v3 -mtune=arrowlake -ffp-contract=off
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Apply the tuning patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --whitespace=nowarn lichii-tuned/lichii-tuned.patch
          printf '%s' "$GITHUB_SHA" > GIT-COMMIT
          printf '%s' "tuned-tests-r${GITHUB_RUN_NUMBER}" > GIT-REFSPEC

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p llvm:p compiler-rt:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-tuned-tests-v1-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-tuned-tests-v1-
            cpm-tuned-v1-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: objects-tuned-tests-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-tuned-tests-v1-

      # The build workflow checks the warnings; this one only has to run the tests.
      # -fsized-deallocation: tests instantiate fssystem_bucket_tree.h's sized ::operator delete,
      # which libstdc++ declares only with it (the MinGW runtime has it; clang-cl's STL always
      # declares it, and lichii.exe never instantiates that code).
      - name: Configure
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_WERROR=OFF \
            -DBUILD_TESTING=ON \
            -DYUZU_TESTS=ON \
            -DYUZU_CMD=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DENABLE_LTO=OFF \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            "-DCMAKE_C_FLAGS=$TUNE_FLAGS" \
            "-DCMAKE_CXX_FLAGS=$TUNE_FLAGS -fsized-deallocation"

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build the tests
        shell: msys2 {0}
        run: |
          ccache --zero-stats
          # -k 0: a failing file doesn't stop the others, so one run lists every error.
          cmake --build build/release --target tests --parallel -- -k 0
          ccache --show-stats

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Run the tests
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build/release/bin
          ./tests.exe --order decl --colour-mode none

      # The clock trace's PDH, power and thread-time calls on a real Windows host (the test is
      # skipped in the run above, without the variable). It prints the lines it logged.
      - name: Run the clock trace
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build/release/bin
          EDEN_NX2_CLOCK_TRACE=1 ./tests.exe "[clock_trace]" --colour-mode none
